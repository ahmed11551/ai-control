; Кастомные сценарии без правки основного dialplan.
; Примеры: ночные часы, чёрный список, VIP-маршрутизация.

[night-hours]
exten => s,1,GotoIfTime(9:00-18:00,mon-fri,*,*?open:closed)
 same => n(open),Return()
 same => n(closed),Voicemail(1001@default,s)
 same => n,Hangup()

[blacklist]
; Номера через AMI/DB: Set(DB(blacklist/${CALLERID(num)})=1)
exten => s,1,GotoIf($[${DB_EXISTS(blacklist/${CALLERID(num)})}]?block:ok)
 same => n(block),Playback(ss-noservice)
 same => n,Hangup()
 same => n(ok),Return()
