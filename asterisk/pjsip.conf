[general]
transport=udp

[global]
type=global
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=YOUR.PUBLIC.IP
external_signaling_address=YOUR.PUBLIC.IP
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; --- Транк провайдера (замените host/user/secret) ---
[trunk]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:sip.your-provider.ru
client_uri=sip:trunk_login@sip.your-provider.ru
retry_interval=60

[trunk-auth]
type=auth
auth_type=userpass
username=trunk_login
password=trunk_password

[trunk-aor]
type=aor
contact=sip:sip.your-provider.ru:5060
qualify_frequency=30

[trunk-identify]
type=identify
endpoint=trunk-ep
match=sip.your-provider.ru

[trunk-ep]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=ulaw,alaw,g722,opus
outbound_auth=trunk-auth
aors=trunk-aor
from_user=74951234567
from_domain=sip.your-provider.ru
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no

; --- Внутренние SIP-пользователи (WebRTC + softphone) ---
; Шаблон: 10XX. Пароли смените. Backend синхронизирует через AMI.

[endpoint-internal](!)
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=ulaw,alaw,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
dtmf_mode=rfc4733
callerid=CRM User <1000>
mailboxes=1000@default

[auth-internal](!)
type=auth
auth_type=userpass

[aor-internal](!)
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

[1001](endpoint-internal)
auth=1001
aors=1001
callerid=Admin <1001>
mailboxes=1001@default

[1001]
