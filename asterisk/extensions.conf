[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
TRUNK=PJSIP/trunk-ep
REC_DIR=/var/spool/asterisk/monitor
CRM_AGI=agi://127.0.0.1:4573/crm

; ========== Входящие с транка ==========
[from-trunk]
exten => _X.,1,NoOp(INBOUND ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CDR(userfield)=inbound)
 same => n,Set(__CRM_DIRECTION=inbound)
 same => n,Set(__CRM_FROM=${CALLERID(num)})
 same => n,Set(__CRM_TO=${EXTEN})
 same => n,MixMonitor(${UNIQUEID}.wav,b)
 same => n,UserEvent(CrmCallStart,Uniqueid:${UNIQUEID},Direction:inbound,From:${CALLERID(num)},To:${EXTEN})
 same => n,Goto(ivr-main,s,1)

[ivr-main]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Background(silence/1)
 same => n,Playback(hello-world)
 same => n,Set(TIMEOUT(digit)=4)
 same => n,Set(TIMEOUT(response)=8)
 same => n,Background(silence/1)
 same => n,WaitExten(8)

exten => 1,1,Goto(queues,sales,1)
exten => 2,1,Goto(queues,support,1)
exten => 9,1,Voicemail(1001@default,u)
exten => t,1,Goto(queues,sales,1)
exten => i,1,Playback(invalid)
 same => n,Goto(s,1)

[queues]
exten => sales,1,NoOp(Queue sales)
 same => n,Queue(sales,t,,,30)
 same => n,Goto(voicemail-sales,s,1)

exten => support,1,Queue(support,t,,,45)
 same => n,Voicemail(1003@default,u)
 same => n,Hangup()

[voicemail-sales]
exten => s,1,Voicemail(1001@default,u)
 same => n,Hangup()

; ========== Исходящие с внутренних ==========
[from-internal]
include => extensions_custom
include => outbound
include => internal-ext
include => features

[internal-ext]
exten => _10XX,1,NoOp(Internal ${EXTEN})
 same => n,Set(CDR(userfield)=internal)
 same => n,MixMonitor(${UNIQUEID}.wav,b)
 same => n,UserEvent(CrmCallStart,Uniqueid:${UNIQUEID},Direction:internal,From:${CALLERID(num)},To:${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

[outbound]
; 8XXXXXXXXXX / 7XXXXXXXXXX / +7... → транк. Права: приложение CRM решает ДО originate.
exten => _8XXXXXXXXXX,1,Goto(outbound-go,${EXTEN:1},1)
exten => _7XXXXXXXXXX,1,Goto(outbound-go,${EXTEN},1)
exten => _+7XXXXXXXXXX,1,Goto(outbound-go,${EXTEN:2},1)
exten => _9XXXXXXXXXX,1,Goto(outbound-go,7${EXTEN:1},1)

[outbound-go]
exten => _X.,1,NoOp(OUTBOUND ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CDR(userfield)=outbound)
 same => n,Set(__CRM_DIRECTION=outbound)
 same => n,MixMonitor(${UNIQUEID}.wav,b)
 same => n,UserEvent(CrmCallStart,Uniqueid:${UNIQUEID},Direction:outbound,From:${CALLERID(num)},To:${EXTEN})
 same => n,Set(CALLERID(num)=74951234567)
 same => n,Dial(${TRUNK}/7${EXTEN:1},60,tT)
 same => n,Hangup()

[features]
; Конференция 700
exten => 700,1,Answer()
 same => n,ConfBridge(crm-main)

; Запись на диск + hangup handler для CRM
exten => h,1,NoOp(Hangup ${UNIQUEID} duration=${CDR(billsec)} disp=${CDR(disposition)})
 same => n,UserEvent(CrmCallEnd,Uniqueid:${UNIQUEID},Duration:${CDR(billsec)},Disposition:${CDR(disposition)},Recording:${UNIQUEID}.wav)

; Originate из CRM (AMI) попадает сюда
[from-crm]
exten => _X.,1,NoOp(CRM originate ${EXTEN})
 same => n,Set(CDR(userfield)=crm-originate)
 same => n,MixMonitor(${UNIQUEID}.wav,b)
 same => n,UserEvent(CrmCallStart,Uniqueid:${UNIQUEID},Direction:outbound,From:${CALLERID(num)},To:${EXTEN},DealId:${DEAL_ID},LeadId:${LEAD_ID},UserId:${CRM_USER_ID})
 same => n,Dial(${TRUNK}/${EXTEN},60,tT)
 same => n,Hangup()

exten => h,1,UserEvent(CrmCallEnd,Uniqueid:${UNIQUEID},Duration:${CDR(billsec)},Disposition:${CDR(disposition)},Recording:${UNIQUEID}.wav)
