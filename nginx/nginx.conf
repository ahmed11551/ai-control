worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 64m;
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream api { server backend:8080; }
  upstream web { server frontend:80; }

  # HTTP: ACME + редирект на HTTPS
  # certbot: --cert-name forgecrm -d kr-flow.ru -d www.kr-flow.ru
  server {
    listen 80;
    server_name kr-flow.ru www.kr-flow.ru;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://kr-flow.ru$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name www.kr-flow.ru;

    ssl_certificate     /etc/letsencrypt/live/forgecrm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forgecrm/privkey.pem;

    return 301 https://kr-flow.ru$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name kr-flow.ru;

    ssl_certificate     /etc/letsencrypt/live/forgecrm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forgecrm/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    location /webhooks/ {
      proxy_pass http://api/webhooks/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://api/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
